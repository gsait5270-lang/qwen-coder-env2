[project]
name = "slop-guard"
dynamic = ["version"]
description = "CI/CD detector for AI hallucinations and 'AI slop' in code and text (hallucinated APIs, dead imports, noise comments, stubs, phantom sources)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "slop-guard contributors" }]
keywords = ["ai", "linting", "sarif", "github-action", "code-quality", "hallucination"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12",
  "PyYAML>=6.0",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23,<0.25",  # ABI-compatible with tree-sitter 0.24
  "pathspec>=0.12",             # gitignore-semantics exclude matching
  "httpx>=0.27",
]

[project.optional-dependencies]
languages = [
  "tree-sitter-language-pack>=0.7",  # JS/TS/Rust/Go grammars for future detectors
]
semantic = [
  "sentence-transformers>=3.0",   # cross-encoder comment/code similarity (module 2b)
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "jsonschema>=4.22",             # SARIF schema validation in tests
]

[project.scripts]
slop-guard = "slop_guard.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slop_guard"]

[tool.hatch.version]
path = "src/slop_guard/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP modernisation.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
  "E501",   # line length handled by the formatter
  "B008",   # typer.Option/Argument in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
# fixtures intentionally contain AI slop (dead imports, stubs, phantoms)
"tests/fixtures/**" = ["ALL"]
# benchmark dataset is a labeled corpus of slop — it MUST stay sloppy
"benchmarks/dataset/**" = ["ALL"]
# tests use pytest fixtures/marks that look unused to pyflakes
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src/slop_guard"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
# third-party grammars/clients ship without type info
[[tool.mypy.overrides]]
module = ["tree_sitter.*", "tree_sitter_python.*", "tree_sitter_language_pack.*",
          "sentence_transformers.*", "pathspec.*"]
ignore_missing_imports = true
